<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTransit — Karunya University Transport Portal</title>
  
  <!-- Plus Jakarta Sans & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet CSS & JS for OpenStreetMap Navigation -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    #tracking-map { height: 100%; min-height: 480px; width: 100%; border-radius: 12px; z-index: 10; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
  <!-- Custom Enterprise Stylesheet for Authentic SaaS Look -->
  <link rel="stylesheet" href="/style.css?v=2.0">
</head>
<body class="h-full flex flex-col text-slate-800 antialiased overflow-hidden selection:bg-indigo-500 selection:text-white">

  <!-- TOP BAR (PREMIUM OBSIDIAN & INDIGO HEADER WITH CONTRASTING ACCENTS) -->
  <header class="bg-[#0f172a] text-white border-b border-slate-800 px-6 h-16 flex items-center justify-between flex-shrink-0 z-50 shadow-md">
    <!-- Brand & Bespoke Logo -->
    <div class="flex items-center space-x-3.5 cursor-pointer select-none" onclick="navigate('dashboard')">
      <!-- Modern Geometric Transit Radar Logo with Crisp Contrast -->
      <div class="relative w-10 h-10 flex-shrink-0">
        <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500 via-sky-400 to-emerald-400 rounded-xl rotate-6 opacity-75 blur-xs"></div>
        <div class="relative w-10 h-10 rounded-xl bg-[#090d16] p-2 flex items-center justify-center border border-indigo-400/50 shadow-lg">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
            <!-- Curved Route Trajectory -->
            <path d="M8 30C12 20 18 12 32 10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
            <!-- Secondary Loop Vector -->
            <path d="M12 32C18 32 24 28 28 20" stroke="#a5b4fc" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 3"/>
            <!-- Core GPS Waypoint Pulse -->
            <circle cx="32" cy="10" r="5" fill="#4f46e5" stroke="#ffffff" stroke-width="1.8"/>
            <circle cx="32" cy="10" r="2" fill="#38bdf8"/>
            <!-- Origin Station Marker -->
            <circle cx="8" cy="30" r="3" fill="#10b981"/>
          </svg>
        </div>
      </div>

      <div>
        <div class="flex items-center space-x-2.5">
          <span class="text-xl font-black tracking-tight bg-gradient-to-r from-white via-indigo-100 to-sky-300 bg-clip-text text-transparent">UniTransit</span>
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider bg-indigo-500/25 text-indigo-300 border border-indigo-400/40 uppercase">Karunya University</span>
        </div>
        <span class="text-[11px] block text-slate-400 font-medium leading-none mt-1">Smart Fleet &bull; Karunya Nagar &bull; Coimbatore</span>
      </div>
    </div>

    <!-- User / Persona Bar -->
    <div id="nav-user-bar" class="flex items-center space-x-3"></div>
  </header>

  <!-- 100% VIEWPORT WORKSPACE (STANDARD LEFT SIDEBAR + MAIN CONTENT) -->
  <div id="app-root" class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar and Main Canvas rendered here -->
  </div>

  <!-- NOTIFICATION TOAST -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform transition-all duration-300 translate-y-24 opacity-0 pointer-events-none bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700 text-xs font-semibold">
    <i id="toast-icon" data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">Notification</span>
  </div>

  <script src="/app.js?v=2.0"></script>
</body>
</html>
